<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lkrag-lite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <h1>lkrag-lite</h1>
      <div class="header-actions">
        <button id="btn-settings">⚙ Settings</button>
        <button id="btn-shutdown">Shutdown</button>
      </div>
    </header>

    <!-- Top pane: Workspace + Index -->
    <div id="top-pane">
      <div id="workspace-row">
        <span class="pane-label">Workspace</span>
        <select id="ws-select"></select>
        <button id="btn-add-ws">+ Add...</button>
        <button id="btn-delete-ws" class="danger">Delete</button>
        <p id="ws-empty" class="muted hidden">No workspaces. Click "+ Add..." to get started.</p>
      </div>
      <div id="index-row">
        <span class="pane-label">Index</span>
        <span id="index-stats" class="index-stats"></span>
        <button id="btn-update">Update</button>
        <button id="btn-rebuild">Full Rebuild</button>
        <button id="btn-cancel" disabled>Cancel</button>
        <p id="index-error" class="error hidden"></p>
      </div>
      <div id="history-row">
        <div id="history-header">
          <span class="pane-label">Chat History</span>
          <button id="btn-delete-all-chats" class="danger btn-sm" title="Delete all chats">Delete All</button>
        </div>
        <div id="chat-history-list"></div>
      </div>
    </div>

    <!-- Chat area -->
    <div id="chat-main">
      <div id="chat-header">
        <span id="chat-title" class="muted">Select a workspace to start chatting</span>
        <div class="chat-header-actions">
          <button id="btn-copy-all">Copy All</button>
          <button id="btn-new-chat">New Chat</button>
        </div>
      </div>

      <div id="chat-thread"></div>

      <div id="chat-input-area">
        <p id="search-error" class="error hidden"></p>
        <div id="tag-filter">
          <span class="muted">Tag filter:</span>
          <span id="tag-filter-chips"></span>
          <input id="tag-filter-input" list="tag-filter-list" placeholder="+ tag, -tag to exclude" autocomplete="off" />
          <datalist id="tag-filter-list"></datalist>
          <datalist id="tag-list"></datalist>
        </div>
        <form id="search-form">
          <textarea id="search-query" rows="3" placeholder="Ask a question..." required></textarea>
          <button type="submit" id="btn-search">Send</button>
        </form>
      </div>
    </div>

    <!-- Settings modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h2>Settings</h2>
        <div class="settings-grid">
          <label for="cfg-top-k">Top K</label>
          <input id="cfg-top-k" type="number" min="1" max="50" step="1" />

          <label for="cfg-min-sim">Min Similarity</label>
          <input id="cfg-min-sim" type="number" min="0" max="1" step="0.01" />

          <label for="cfg-output-instructions">Output Instructions</label>
          <textarea id="cfg-output-instructions" rows="5" placeholder="e.g. Answer in Japanese."></textarea>
        </div>
        <p id="settings-status" class="muted hidden"></p>
        <div class="modal-actions">
          <button id="btn-reload-env">Reload .env</button>
          <button id="btn-settings-close">Cancel</button>
          <button id="btn-save-settings" class="primary">Apply</button>
        </div>
      </div>
    </div>

    <!-- Directory picker modal -->
    <div id="dir-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h2>Add Workspace</h2>
        <div class="modal-path-row">
          <input id="modal-path-input" type="text" placeholder="/home/..." />
          <button id="modal-go-btn">Go</button>
        </div>
        <div id="modal-dir-list"></div>
        <div class="modal-name-row">
          <label>Name</label>
          <input id="modal-name-input" type="text" placeholder="Workspace name" />
        </div>
        <p id="modal-error" class="error hidden"></p>
        <div class="modal-actions">
          <button id="modal-cancel-btn">Cancel</button>
          <button id="modal-add-btn" class="primary">Add</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
