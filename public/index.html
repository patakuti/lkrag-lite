<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lkrag-lite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>lkrag-lite</h1>
      <button id="btn-shutdown">Shutdown</button>
    </header>

    <main>
      <!-- Workspace panel -->
      <section id="workspace-section">
        <h2>Workspace</h2>
        <div class="workspace-row">
          <select id="ws-select"></select>
          <button id="btn-add-ws">+ Add...</button>
          <button id="btn-delete-ws" class="danger">Delete</button>
        </div>
        <p id="ws-empty" class="muted hidden">No workspaces. Click "+ Add..." to get started.</p>
      </section>

      <!-- Directory picker modal -->
      <div id="dir-modal" class="modal-overlay hidden">
        <div class="modal-box">
          <h2>Add Workspace</h2>
          <div class="modal-path-row">
            <input id="modal-path-input" type="text" placeholder="/home/..." />
            <button id="modal-go-btn">Go</button>
          </div>
          <div id="modal-dir-list"></div>
          <div class="modal-name-row">
            <label>Name</label>
            <input id="modal-name-input" type="text" placeholder="Workspace name" />
          </div>
          <p id="modal-error" class="error hidden"></p>
          <div class="modal-actions">
            <button id="modal-cancel-btn">Cancel</button>
            <button id="modal-add-btn" class="primary">Add</button>
          </div>
        </div>
      </div>

      <!-- Index panel -->
      <section id="index-section">
        <h2>Index</h2>
        <p id="index-stats" class="index-stats"></p>
        <div id="index-controls">
          <button id="btn-update">Update</button>
          <button id="btn-rebuild">Full Rebuild</button>
          <button id="btn-cancel" disabled>Cancel</button>
        </div>
        <p id="index-error" class="error hidden"></p>
      </section>

      <!-- Search panel -->
      <section id="search-section">
        <h2>Search</h2>
        <form id="search-form">
          <textarea id="search-query" rows="3" placeholder="Enter your question..." required></textarea>
          <button type="submit" id="btn-search">Search</button>
        </form>
        <div id="search-spinner" class="hidden">Processing...</div>
        <p id="search-error" class="error hidden"></p>
      </section>

      <!-- Answer panel -->
      <section id="answer-section" class="hidden">
        <h2>Answer</h2>
        <div id="answer-text"></div>
        <div id="citations-section" class="hidden">
          <h3>References</h3>
          <div id="citation-list"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
