<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lkrag-lite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>lkrag-lite</h1>
    </header>

    <main>
      <!-- Workspace panel -->
      <section id="workspace-section">
        <h2>ワークスペース</h2>
        <div id="workspace-list"></div>
        <button id="btn-add-ws">+ ワークスペースを追加...</button>
      </section>

      <!-- Directory picker modal -->
      <div id="dir-modal" class="modal-overlay hidden">
        <div class="modal-box">
          <h2>ディレクトリを選択</h2>
          <div class="modal-path-row">
            <input id="modal-path-input" type="text" placeholder="/home/..." />
            <button id="modal-go-btn">移動</button>
          </div>
          <div id="modal-dir-list"></div>
          <div class="modal-name-row">
            <label>名前</label>
            <input id="modal-name-input" type="text" placeholder="ワークスペース名" />
          </div>
          <p id="modal-error" class="error hidden"></p>
          <div class="modal-actions">
            <button id="modal-cancel-btn">キャンセル</button>
            <button id="modal-add-btn" class="primary">追加</button>
          </div>
        </div>
      </div>

      <!-- Index panel -->
      <section id="index-section">
        <h2>インデックス</h2>
        <div id="index-controls">
          <button id="btn-update">増分更新</button>
          <button id="btn-rebuild">フルリビルド</button>
          <button id="btn-cancel" disabled>中断</button>
        </div>
        <div id="index-progress" class="hidden">
          <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
          <p id="progress-text"></p>
        </div>
        <p id="index-error" class="error hidden"></p>
      </section>

      <!-- Search panel -->
      <section id="search-section">
        <h2>検索</h2>
        <form id="search-form">
          <textarea id="search-query" rows="3" placeholder="質問を入力してください" required></textarea>
          <button type="submit" id="btn-search">検索</button>
        </form>
        <div id="search-spinner" class="hidden">処理中...</div>
        <p id="search-error" class="error hidden"></p>
      </section>

      <!-- Answer panel -->
      <section id="answer-section" class="hidden">
        <h2>回答</h2>
        <div id="answer-text"></div>
        <div id="citations-section" class="hidden">
          <h3>引用</h3>
          <div id="citation-list"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
